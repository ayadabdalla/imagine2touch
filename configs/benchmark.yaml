seeds: [0]
experiments: [shape_classification, correspondence, touch_prediction]     # object_recognition runs on the v6 sessions

data:
  file: imagine2touch.npz
  sessions: [flower, hexagon, parallelogram, star, square, cutter]
  train: [flower, hexagon]
  validation: [cutter]
  recognition: [parallelogram, square, star]
  max_signal: null          # no touch is dropped: the quantile scaling makes the one glitched reading harmless

model:                      # the thesis's training (AIS repository, commit e1fe6d0f of 31 August 2023)
  architecture: mlp         # 2304 - 200 - 200 - 5, then 500 to the signal and 2000 to the mask
  scaling: quantile         # every value to its rank among the training signals, 0 to 1
  absolute: true            # the size of every value: |reading - ambient|
  epochs: 131
  patience: null
  lr: 1.0e-3
  batch_size: 64
  image_weight: 1.0         # weight of the mask error (binary cross-entropy) relative to the touch error
  device: auto

correspondence:
  clusters: 5
  shuffles: 200             # random image-signal pairings used as the baseline
  figure:
    seed: 42
    spacing: [2.5, 1.0]     # minimum distance between example touches along each layout axis

touch_prediction:
  inputs: [mask, depth]

object_recognition:
  touches: 10               # per object
  runs: 1                   # per object, as in the paper
  targets: 5000             # scan points per candidate used as aim points
  reach: null               # every touch counts, as on the paper's robot; a number here keeps only touches this close to a real one [m]
  turn: null                # and one here only those made from within this angle of it [degrees]

shape_classification:
  network: wide             # 15 - 500 - 10 - 5
  epochs: 130               # as long as the thesis trained (its Fig. 23)
  lr: 1.0e-3
  batch_size: 64
  seed: 123
  certainty: 0.9            # probability above which a class counts as named
