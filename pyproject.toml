[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "imagine2touch"
version = "2.0.0"
description = "Imagine2touch: predicting the touch signal of a ReSkin sensor from depth images of the surface"
authors = [{name = "Abdullah Ayad"}]
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.8"          # 3.8 is the Python of ROS Noetic, which the robot needs
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "tabulate>=0.9",
    "openTSNE>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]
robot = ["pyrealsense2", "pyserial", "opencv-python", "reskin_sensor @ git+https://github.com/raunaqbhirangi/reskin_sensor.git"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
